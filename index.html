
<script>
(() => {
  const input = document.getElementById('url');
  const status = document.getElementById('status');
  const downloads = document.getElementById('downloads');
  const tabs = [...document.querySelectorAll('.tab')];
  let platform = 'Auto detect';

  const KEY = 'savehubbd-history-v1';

  function readHistory() {
    try {
      return JSON.parse(localStorage.getItem(KEY) || '[]');
    } catch {
      return [];
    }
  }

  function writeHistory(items) {
    try {
      localStorage.setItem(KEY, JSON.stringify(items.slice(0, 30)));
    } catch {}
  }

  function detect(url) {
    if (/facebook\.com|fb\.watch/i.test(url)) return 'Facebook';
    if (/instagram\.com/i.test(url)) return 'Instagram';
    if (/pinterest\.[a-z.]+|pin\.it/i.test(url)) return 'Pinterest';
    return platform === 'Auto detect' ? 'Direct media / other' : platform;
  }

  function message(text, kind = '') {
    status.className = 'status show ' + kind;
    status.textContent = text;
  }

  function render() {
    const items = readHistory();
    downloads.replaceChildren();

    if (!items.length) {
      const empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = 'No link history yet. Your downloaded files stay on your device.';
      downloads.append(empty);
      return;
    }

    items.forEach(item => {
      const row = document.createElement('div');
      row.className = 'item';

      const details = document.createElement('div');
      details.className = 'details';

      const title = document.createElement('strong');
      title.textContent = item.platform + ' · ' + item.url;

      const small = document.createElement('small');
      small.textContent = item.date + ' · Link history only';

      details.append(title, small);

      const open = document.createElement('button');
      open.className = 'secondary';
      open.textContent = 'Open link';
      open.addEventListener('click', () => {
        window.open(item.url, '_blank', 'noopener,noreferrer');
      });

      row.append(details, open);
      downloads.append(row);
    });
  }

  tabs.forEach(tab => {
    tab.addEventListener('click', () => {
      tabs.forEach(t => t.classList.toggle('active', t === tab));
      platform = tab.dataset.platform;
    });
  });

  document.getElementById('go').addEventListener('click', () => {
    const raw = input.value.trim();
    let parsed;

    try {
      parsed = new URL(raw);
    } catch {
      message('Please enter a valid URL starting with https://', 'warn');
      return;
    }

    if (!['http:', 'https:'].includes(parsed.protocol)) {
      message('Only HTTP and HTTPS links are supported.', 'warn');
      return;
    }

    const host = parsed.hostname.toLowerCase();
    const isFacebook =
      host === 'facebook.com' || host.endsWith('.facebook.com') ||
      host === 'fb.watch';

    const isInstagram =
      host === 'instagram.com' || host.endsWith('.instagram.com');

    const isPinterest =
      host === 'pinterest.com' || host.endsWith('.pinterest.com') ||
      host === 'pin.it';

    const isDirectMedia =
      /\.(mp4|webm|mov|m4v|jpg|jpeg|png|gif|webp)$/i.test(parsed.pathname);

    if (platform === 'Facebook' && !isFacebook) {
      message('Please paste a Facebook link.', 'warn');
      return;
    }

    if (platform === 'Instagram' && !isInstagram) {
      message('Please paste an Instagram link.', 'warn');
      return;
    }

    if (platform === 'Pinterest' && !isPinterest) {
      message('Please paste a Pinterest link.', 'warn');
      return;
    }

    const detected = detect(parsed.href);
    const history = readHistory();

    history.unshift({
      url: parsed.href,
      platform: detected,
      date: new Date().toLocaleString()
    });

    writeHistory(history);
    render();

    if (isFacebook || isInstagram || isPinterest) {
      message(
        detected + ' link saved. Automatic media downloading is not connected yet, so this page will not redirect you. A supported backend integration is needed to fetch downloadable media.',
        'warn'
      );
      return;
    }

    if (platform === 'Direct media' || isDirectMedia) {
      if (!isDirectMedia) {
        message(
          'This link does not look like a direct image or video URL. A media file link is needed.',
          'warn'
        );
        return;
      }

      const link = document.createElement('a');
      link.href = parsed.href;
      link.download = '';
      link.target = '_blank';
      link.rel = 'noopener noreferrer';
      document.body.append(link);
      link.click();
      link.remove();

      message(
        'Download requested. Your browser or the media server may open the file instead. If so, use the browser menu to download it.',
        'good'
      );
      return;
    }

    message(
      'Link saved to My Downloads history. This URL is not recognized as a supported direct media file.',
      'warn'
    );
  });

  input.addEventListener('keydown', event => {
    if (event.key === 'Enter') {
      document.getElementById('go').click();
    }
  });

  document.getElementById('clear').addEventListener('click', () => {
    writeHistory([]);
    render();
    message('Link history cleared.', 'good');
  });

  render();
})();
</script>
